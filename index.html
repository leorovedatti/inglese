  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>startDay(+b.dataset.go)));
  document.getElementById("reset").addEventListener("click",()=>{
    let ok = true; try{ ok = confirm("Vuoi cancellare tutti i risultati salvati?"); }catch(e){}
    if(ok){ save({}); home(); }
  });
}

function header(step){
  const d = cur.d;
  const labels = [d.listen ? "1. Ascolto e testo" : "1. Primo testo", "2. Secondo testo", "3. Parole nuove"];
  return `<button class="back" id="back">‹ Tutti i giorni</button>
  <p class="muted" style="margin:6px 0 0">Giorno ${d.id}, ${d.weekday}</p>
  <div class="steps">${labels.map((l,i)=>`<span class="${step===i+1?"on":""}">${l}</span>`).join("")}</div>`;
}
function bindBack(){ const b=document.getElementById("back"); if(b) b.addEventListener("click",home); }

// ================= TESTI BUCATI =================
function startDay(id){
  const d = DAYS.find(x=>x.id===id);
  cur = {d, k:0, e:0, en:0};
  renderText();
}
function renderBody(text){
  return text.split(/\n\s*\n/).map(block=>{
    const lines = block.split("\n");
    let out = "";
    if(lines[0].startsWith("## ")){ out += `<h3>${esc(lines.shift().slice(3))}</h3>`; }
    let t = esc(lines.join(" "));
    t = t.replace(/\[\[(\d+)\]\]/g,(m,n)=>`<span class="gapn">(${n})</span> <input class="gap" data-n="${n}" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" aria-label="Spazio ${n}">`);
    return out + `<p lang="en">${t}</p>`;
  }).join("");
}
function scriptOf(part){ return part.text.replace(/^## .*$/gm,"").replace(/\[\[(\d+)\]\]/g,(m,n)=>part.answers[n][0]).replace(/\s+/g," ").trim(); }
function renderText(){
  const d = cur.d, part = d.parts[cur.k];
  let h = header(cur.k+1) + `<h1><span class="mark">${esc(part.title)}</span></h1>`;
  if(cur.k===0) h += `<div class="box tip"><b>Il trucco di oggi</b><br>${esc(TIPS[d.weekday])}</div>`;
  h += `<p><b>${part.listen?"Leggi il testo, poi ascoltalo. ":""}Completa ogni spazio con una parola del riquadro, nella forma giusta: verbo coniugato, plurale, comparativo, avverbio, parola derivata... Ci sono 2 parole in più.</b></p>
    <div class="box"><div class="bank" lang="en">${shuffle(part.bank).map(w=>`<span>${esc(w)}</span>`).join("")}</div></div>`;
  if(part.listen){
    h += `<div class="box"><div class="player">
        <button class="btn" type="button" id="play">▶ Ascolta</button>
        <button class="btn alt" type="button" id="slow">Ascolta più lento</button>
        <button class="btn alt" type="button" id="stop">■ Stop</button>
      </div><p class="muted" id="sp-msg">Se non senti nulla, alza il volume e controlla che il telefono non sia in silenzioso.</p></div>`;
  }
  h += `<div class="box text">${renderBody(part.text)}</div>
    <button class="btn" id="check">Controlla le risposte</button><div id="res"></div>`;
  app.innerHTML = h; goTop(); bindBack();
  if(part.listen){
    document.getElementById("play").addEventListener("click",()=>speak(0.95));
    document.getElementById("slow").addEventListener("click",()=>speak(0.72));
    document.getElementById("stop").addEventListener("click",stopSpeak);
  }
  document.getElementById("check").addEventListener("click", checkText);
}
function checkText(){
  const d = cur.d, part = d.parts[cur.k]; let ok=0, tot=0; const fb=[];
  Object.keys(part.answers).forEach(n=>{
    tot++;
    const el = document.querySelector(`input.gap[data-n="${n}"]`);
    const val = norm(el.value);
    const good = part.answers[n].includes(val);
    if(good) ok++;
    el.classList.add(good?"ok":"ko"); el.readOnly = true;
    fb.push({n, good, given:el.value.trim(), sol:part.answers[n].join(" / "), ex:part.expl[n]});
  });
  stopSpeak();
  cur.e += ok; cur.en += tot;
  const p = load(); p[d.id] = Object.assign({}, p[d.id]||{}, {e:cur.e, en:cur.en, il:new Date().toISOString().slice(0,10)}); save(p);
  document.getElementById("check").remove();
  const pct = ok/tot;
  const msg = pct>=0.8 ? "Ottimo lavoro!" : pct>=0.5 ? "Bene. Leggi con calma le spiegazioni degli errori." : "Leggi bene le spiegazioni: domani rifai questo testo.";
  let h = `<div class="box"><div class="result">${esc(part.title)}: ${ok} su ${tot}</div><p>${msg}</p></div><h2>Le spiegazioni</h2><ul class="fb">`;
  fb.forEach(f=>{ h += `<li class="${f.good?"ok":"ko"}"><b>(${f.n}) ${f.good?"Giusto":"Sbagliato"}.</b> ${!f.good && f.given?`Hai scritto: <span lang="en">${esc(f.given)}</span>. `:""}Risposta: <b lang="en">${esc(f.sol)}</b><br>${esc(f.ex)}</li>`; });
  h += `</ul><button class="btn" id="nextstep">${cur.k===0?"Vai al secondo testo":"Vai alle parole nuove"}</button>`;
  document.getElementById("res").innerHTML = h;
  document.getElementById("nextstep").addEventListener("click", ()=>{ if(cur.k===0){ cur.k=1; renderText(); } else startVocab(); });
}

// ================= ASCOLTO =================
function pickVoice(){
  try{ const vs = window.speechSynthesis.getVoices(); return vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){ return null; }
}
function speak(rate){
  const msg = document.getElementById("sp-msg");
  try{
    if(!window.speechSynthesis) throw new Error("no");
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(scriptOf(cur.d.parts[cur.k]));
    u.lang = "en-GB"; u.rate = rate;
    const v = pickVoice(); if(v) u.voice = v;
    window.speechSynthesis.speak(u);
  }catch(e){ if(msg) msg.textContent = "Qui l'audio non funziona. Apri la pagina nel browser (Safari o Chrome)."; }
}
function stopSpeak(){ try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){} }
try{ if(window.speechSynthesis) window.speechSynthesis.getVoices(); }catch(e){}

// ================= PAROLE NUOVE =================
// Le risposte sbagliate vengono da parole di altri giorni, sempre diverse,
// così non si può indovinare per esclusione.
function startVocab(){
  const d = cur.d;
  const todayIt = new Set(d.allVocab.map(v=>v[1]));
  const used = new Set();
  cur.qs = shuffle(d.allVocab).map(([en,it])=>{
    const isVerb = /^to /.test(en);
    let pool = ALLV.filter(x=>x.day!==d.id && !todayIt.has(x.it) && !used.has(x.it) && x.verb===isVerb);
    if(pool.length<3) pool = ALLV.filter(x=>x.day!==d.id && !todayIt.has(x.it) && !used.has(x.it));
    const seen = new Set(); const wrong = [];
    for(const x of shuffle(pool)){ if(!seen.has(x.it)){ seen.add(x.it); wrong.push(x.it); } if(wrong.length===3) break; }
    wrong.forEach(w=>used.add(w));
    return {en, it, opts: shuffle([it, ...wrong])};
  });
  cur.i = 0; cur.v = 0;
  renderVocab();
}
function renderVocab(){
  const q = cur.qs[cur.i];
  app.innerHTML = header(3) + `<h1><span class="mark">Parole nuove</span></h1><div class="box">
    <p class="muted">Parola ${cur.i+1} di ${cur.qs.length}. Cosa significa?</p>
    <div class="word" lang="en">${esc(q.en)}</div>
    <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
    <div id="after"></div></div>`;
  goTop(); bindBack();
  document.querySelectorAll("#opts .opt").forEach(b=>b.addEventListener("click",()=>answerVocab(+b.dataset.k)));
}
function answerVocab(k){
  const q = cur.qs[cur.i];
  const btns = document.querySelectorAll("#opts .opt");
  btns.forEach((b,j)=>{ b.disabled=true; if(q.opts[j]===q.it) b.classList.add("ok"); });
  const right = q.opts[k]===q.it;
  if(right) cur.v++; else btns[k].classList.add("ko");
  const last = cur.i===cur.qs.length-1;
  document.getElementById("after").innerHTML =
    `<p><b>${right?"Giusto!":"Non proprio."}</b> <span lang="en">${esc(q.en)}</span> = ${esc(q.it)}</p>
     <button class="btn" id="nx">${last?"Fine":"Avanti"}</button>`;
  document.getElementById("nx").addEventListener("click",()=>{ if(last) finish(); else { cur.i++; renderVocab(); } });
}
function finish(){
  const d = cur.d;
  const p = load(); p[d.id] = Object.assign({}, p[d.id]||{}, {e:cur.e, en:cur.en, v:cur.v, vn:cur.qs.length, done:true}); save(p);
  const nextDay = DAYS.find(x=>x.id===d.id+1);
  app.innerHTML = header(3) + `<h1><span class="mark">Giorno ${d.id} completato!</span></h1><div class="box">
    <p>Testi: ${cur.e} su ${cur.en}<br>Parole: ${cur.v} su ${cur.qs.length}</p>
    <p class="muted">${nextDay?"Domani ti aspetta: "+esc(nextDay.parts[0].title)+".":"Era l'ultimo giorno. Bravo!"}</p></div>
    <button class="btn" id="home2">Torna ai giorni</button>
    <button class="btn alt" id="redo">Rifai questo giorno</button>`;
  goTop(); bindBack();
  document.getElementById("home2").addEventListener("click",home);
  document.getElementById("redo").addEventListener("click",()=>startDay(d.id));
}

try{ home(); }catch(e){ app.innerHTML = "<p>Errore nel caricamento: " + esc(e && e.message ? e.message : e) + "</p>"; }

</script>
